[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# ERC-4337 v0.8 / EntryPoint 0.8.0 targets Solidity 0.8.28 and uses transient
# storage (TSTORE/TLOAD), so the EVM version must be cancun or newer.
solc = "0.8.28"
evm_version = "cancun"

optimizer = true
optimizer_runs = 200

# Deterministic artifacts (helps when reasoning about CREATE2 deployments).
bytecode_hash = "none"
cbor_metadata = false

# Emit the storage layout in build artifacts — needed when reasoning about
# ERC-7201 namespaced storage and clone storage collisions.
extra_output = ["storageLayout"]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 32

# CI runs a heavier fuzzing budget and full verbosity.
[profile.ci]
verbosity = 3

[profile.ci.fuzz]
runs = 1000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
multiline_func_header = "attributes_first"
sort_imports = true

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
sepolia = {key = "${ETHERSCAN_API_KEY}"}
base_sepolia = {key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api"}

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
