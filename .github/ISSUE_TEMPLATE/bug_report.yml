name: Bug report
description: Something behaves incorrectly (not a security vulnerability)
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security-sensitive issues, **do not use this form** — see
        [SECURITY.md](https://github.com/aalandev8/cinnamon-wallet/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        Steps or, ideally, a failing Foundry test. Include the exact command.
      placeholder: |
        forge test --match-test testX -vvvv
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit / branch
      description: Output of `git rev-parse --short HEAD`
    validations:
      required: true
  - type: input
    id: foundry
    attributes:
      label: Foundry version
      description: Output of `forge --version`
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
